<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Formulário A · Cartões — Compramos Carros</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comum.css">
<style>
body { background: var(--fundo); }
.palco { position: relative; padding: 40px 16px 90px; }
.palco::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 330px; background: linear-gradient(135deg, var(--verde) 0 50%, var(--azul) 50%); clip-path: polygon(0 0, 100% 0, 100% 80%, 0 100%); }
.cartao { position: relative; max-width: 900px; margin: 0 auto; background: #fff; border-radius: var(--raio); box-shadow: 18px 18px 0 var(--lima), 0 30px 60px rgba(0, 0, 0, .18); padding: 30px 34px 26px; }
.cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.passo-n { font-weight: 800; color: var(--verde); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; }
.barra { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-bottom: 22px; }
.barra i { height: 6px; border-radius: 4px; background: var(--linha); transition: background .3s; }
.barra i.feito { background: var(--verde); }
.barra i.atual { background: var(--lima); }
.fichas { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
.fichas span { background: var(--azul); color: #fff; font-weight: 700; font-size: 13px; padding: 5px 12px; border-radius: 999px; animation: entrar .3s; }
.fichas span:last-child { background: var(--verde); }
h2 { font-size: clamp(28px, 4vw, 40px); font-weight: 900; text-transform: uppercase; margin: 14px 0 6px; }
h2 em { font-style: normal; color: var(--verde); }
.ajuda { color: var(--suave); margin: 0 0 18px; }
.passo { animation: entrar .35s; }

.pesquisa { position: relative; margin-bottom: 14px; }
.pesquisa svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; color: var(--verde); }
.pesquisa .entrada { padding-left: 44px; }
.carrossel-wrap { position: relative; }
.carrossel { display: grid; grid-auto-flow: column; grid-template-rows: repeat(3, auto); grid-auto-columns: 148px; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 14px; scrollbar-width: thin; scrollbar-color: var(--verde) transparent; }
.carrossel.uma-linha { grid-template-rows: auto; }
.tile { scroll-snap-align: start; display: flex; align-items: center; gap: 10px; border: 2px solid var(--linha); background: #fff; border-radius: 6px 18px 6px 18px; padding: 10px 12px; cursor: pointer; text-align: left; font: 700 15px/1.15 "Barlow", sans-serif; color: var(--azul); transition: border-color .15s, transform .15s, box-shadow .15s; min-height: 58px; }
.tile:hover { border-color: var(--verde); transform: translateY(-2px); }
.tile.sel { border-color: var(--azul); background: var(--azul); color: #fff; box-shadow: 6px 6px 0 var(--lima); }
.mono { flex: 0 0 34px; height: 34px; border-radius: 50%; background: #eef8f6; color: var(--verde); display: grid; place-items: center; font-weight: 900; font-size: 13px; }
.tile.sel .mono { background: var(--lima); color: var(--azul); }
.setas { display: flex; gap: 8px; }
.setas button { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--linha); background: #fff; color: var(--azul); font-size: 18px; cursor: pointer; }
.setas button:hover { border-color: var(--verde); }

.anos { grid-auto-columns: 92px; }
.anos .tile { justify-content: center; font-size: 22px; font-weight: 900; }
.meses { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 8px; }
.meses .tile { justify-content: center; min-height: 48px; }
.sub { font-weight: 800; color: var(--azul); text-transform: uppercase; font-size: 13px; letter-spacing: .06em; margin: 16px 0 8px; }

.grandes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.grandes.quatro { grid-template-columns: repeat(4, 1fr); }
.grande { border: 2px solid var(--linha); background: #fff; border-radius: 6px 24px 6px 24px; padding: 22px 14px 16px; cursor: pointer; text-align: center; color: var(--azul); font: 800 17px "Barlow", sans-serif; transition: border-color .15s, transform .15s, box-shadow .15s; }
.grande svg { width: 84px; height: 56px; margin: 0 auto 10px; display: block; color: var(--verde); }
.grande small { display: block; font-weight: 500; color: var(--suave); font-size: 13px; margin-top: 2px; }
.grande:hover { border-color: var(--verde); transform: translateY(-3px); }
.grande.sel { background: var(--azul); color: #fff; border-color: var(--azul); box-shadow: 8px 8px 0 var(--lima); }
.grande.sel svg { color: var(--lima); }
.grande.sel small { color: #c9c7d6; }

.campos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.campos .largo { grid-column: 1 / -1; }
.consent { display: flex; gap: 10px; font-size: 13px; color: var(--suave); margin-top: 14px; }
.consent input { accent-color: var(--verde); width: 18px; height: 18px; flex: 0 0 18px; }

.rodape-passos { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--linha); }
.fim { text-align: center; padding: 20px 0 10px; }
.fim .visto { width: 86px; height: 86px; border-radius: 50%; background: var(--lima); color: var(--azul); display: grid; place-items: center; margin: 0 auto 18px; animation: entrar .4s; }
.fim .visto svg { width: 44px; }
.fim p { color: var(--suave); }
@media (max-width: 700px) {
  .cartao { padding: 22px 18px; box-shadow: 10px 10px 0 var(--lima), 0 20px 40px rgba(0, 0, 0, .18); }
  .grandes.quatro { grid-template-columns: repeat(2, 1fr); }
  .meses { grid-template-columns: repeat(4, 1fr); }
  .campos { grid-template-columns: 1fr; }
  .carrossel { grid-auto-columns: 136px; }
  .setas { display: none; }
}
</style>
</head>
<body>
<header class="topo-demo"><div class="c"><img src="../assets/img/logo.svg" alt="Compramos Carros"><a class="voltar" href="index.html">← Ver os 3 modelos</a></div></header>
<div class="palco">
  <div class="cartao">
    <div class="cab"><span class="passo-n" id="passo-n"></span><div class="setas" id="setas"><button type="button" data-dir="-1" aria-label="Anterior">←</button><button type="button" data-dir="1" aria-label="Seguinte">→</button></div></div>
    <div class="barra" id="barra"></div>
    <div class="fichas" id="fichas"></div>
    <div id="conteudo"></div>
    <div class="rodape-passos" id="rodape"><button class="botao claro" id="voltar" type="button">← Voltar</button><button class="botao" id="seguinte" type="button">Seguinte →</button></div>
  </div>
</div>
<p class="aviso-demo">Modelo A · Cartões — demonstração, nada é enviado · <a href="index.html">ver outros</a></p>

<script src="../assets/js/marcas.js"></script>
<script src="comum.js"></script>
<script>
(function () {
  var E = CC.estado, i = 0, $ = function (id) { return document.getElementById(id); };
  var LUPA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>';
  var CAMERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>';
  var mono = function (t) { return t.replace(/[^A-Za-zÀ-ÿ0-9 ]/g, "").split(" ").map(function (p) { return p[0]; }).join("").slice(0, 2).toUpperCase(); };

  function carrossel(lista, campo, extraClasse, comMono) {
    return '<div class="carrossel ' + (extraClasse || "") + '" id="car">' + lista.map(function (v) {
      return '<button type="button" class="tile' + (E[campo] === v ? " sel" : "") + '" data-v="' + v + '">' + (comMono ? '<span class="mono">' + mono(v) + '</span>' : "") + v + '</button>';
    }).join("") + '</div>';
  }

  var PASSOS = [
    { titulo: 'Qual é a <em>marca</em>?', ajuda: "Deslize para o lado ou pesquise.", ok: function () { return E.marca; },
      html: function () { return '<div class="pesquisa">' + LUPA + '<input class="entrada" id="q" placeholder="Pesquisar marca…" autocomplete="off"></div>' + carrossel(CC.marcas(), "marca", "", true); },
      liga: function () { ligaTiles("marca", true); ligaPesquisa(); } },
    { titulo: 'E o <em>modelo</em>?', ajuda: function () { return "Modelos " + E.marca + "."; }, ok: function () { return E.modelo; },
      html: function () { return '<div class="pesquisa">' + LUPA + '<input class="entrada" id="q" placeholder="Pesquisar modelo…" autocomplete="off"></div>' + carrossel(CC.modelos(E.marca), "modelo", "", false); },
      liga: function () { ligaTiles("modelo", true); ligaPesquisa(); } },
    { titulo: 'Quando foi <em>matriculado</em>?', ajuda: "Escolha o ano e o mês da primeira matrícula.", ok: function () { return E.ano && E.mes; },
      html: function () { return '<p class="sub">Ano</p>' + carrossel(CC.anos, "ano", "anos uma-linha") + '<p class="sub">Mês</p><div class="meses">' + CC.meses.map(function (m) { return '<button type="button" class="tile' + (E.mes === m ? " sel" : "") + '" data-m="' + m + '">' + m.slice(0, 3) + '</button>'; }).join("") + '</div>'; },
      liga: function () {
        ligaTiles("ano", false);
        Array.prototype.forEach.call(document.querySelectorAll("[data-m]"), function (b) { b.onclick = function () { E.mes = b.dataset.m; marcar("[data-m]", b); if (E.ano) avancar(); else desenhar(true); }; });
      } },
    { titulo: 'Tipo de <em>caixa</em>', ajuda: "", ok: function () { return E.caixa; },
      html: function () { return '<div class="grandes">' + CC.caixas.map(function (c) { return '<button type="button" class="grande' + (E.caixa === c.id ? " sel" : "") + '" data-g="' + c.id + '">' + c.svg + c.id + '<small>' + c.nota + '</small></button>'; }).join("") + '</div>'; },
      liga: function () { ligaGrandes("caixa"); } },
    { titulo: 'Qual o <em>segmento</em>?', ajuda: "Escolha o formato que mais se parece com o seu carro.", ok: function () { return E.segmento; },
      html: function () { return '<div class="grandes quatro">' + CC.segmentos.map(function (s) { return '<button type="button" class="grande' + (E.segmento === s.id ? " sel" : "") + '" data-g="' + s.id + '">' + s.svg + s.id + '</button>'; }).join("") + '</div>'; },
      liga: function () { ligaGrandes("segmento"); } },
    { titulo: 'Mais alguns <em>detalhes</em>', ajuda: "", ok: function () { return E.matricula && E.km; },
      html: function () { return '<div class="campos"><div><label class="rotulo-campo" for="mat">Matrícula</label><input class="entrada" id="mat" placeholder="AA-00-AA" maxlength="8" value="' + (E.matricula || "") + '"></div><div><label class="rotulo-campo" for="km">Quilómetros</label><input class="entrada" id="km" type="number" inputmode="numeric" placeholder="Ex.: 85000" value="' + (E.km || "") + '"></div><div class="largo"><label class="rotulo-campo" for="obs">Observações (opcional)</label><textarea class="entrada" id="obs" placeholder="Extras, estado geral, revisões feitas, eventuais danos…">' + (E.obs || "") + '</textarea></div></div>'; },
      liga: function () {
        $("mat").oninput = function () { this.value = this.value.toUpperCase(); E.matricula = this.value; botoes(); };
        $("km").oninput = function () { E.km = this.value; botoes(); };
        $("obs").oninput = function () { E.obs = this.value; };
      } },
    { titulo: 'Mostre-nos o seu <em>carro</em>', ajuda: "Opcional, mas ajuda-nos a fazer uma proposta mais certa.", ok: function () { return true; }, opcional: true,
      html: function () { return '<label class="zona-fotos">' + CAMERA + '<div><b>Carregar fotos (até 10)</b><span>Exterior, interior, conta-quilómetros e eventuais danos.</span></div><input type="file" accept="image/*" multiple id="fotos"></label><div class="lista-fotos" id="lista"></div>'; },
      liga: function () { CC.fotos($("fotos"), $("lista"), botoes); } },
    { titulo: 'Os seus <em>dados</em>', ajuda: "Para lhe enviarmos a proposta em 24 horas.", ok: function () { return E.nome && E.telefone && E.email && E.distrito && E.consent; }, final: true,
      html: function () { return '<div class="campos"><div><label class="rotulo-campo" for="nome">Nome</label><input class="entrada" id="nome" autocomplete="name"></div><div><label class="rotulo-campo" for="tel">Telefone</label><input class="entrada" id="tel" type="tel" autocomplete="tel"></div><div><label class="rotulo-campo" for="email">E-mail</label><input class="entrada" id="email" type="email" autocomplete="email"></div><div><label class="rotulo-campo" for="dist">Distrito</label><select class="entrada" id="dist"><option value="">Escolha…</option>' + CC.DISTRITOS.map(function (d) { return "<option>" + d + "</option>"; }).join("") + '</select></div></div><label class="consent"><input type="checkbox" id="consent"><span>Os dados recolhidos serão incluídos na nossa agenda de contactos, de acordo com a legislação de proteção de dados em vigor. <a href="../politica-de-privacidade.html">Política de Privacidade</a></span></label>'; },
      liga: function () {
        [["nome", "nome"], ["tel", "telefone"], ["email", "email"], ["dist", "distrito"]].forEach(function (p) { var el = $(p[0]); el.value = E[p[1]] || ""; el.oninput = el.onchange = function () { E[p[1]] = el.value; botoes(); }; });
        $("consent").checked = !!E.consent; $("consent").onchange = function () { E.consent = this.checked; botoes(); };
      } }
  ];

  function marcar(sel, el) { Array.prototype.forEach.call(document.querySelectorAll(sel), function (b) { b.classList.toggle("sel", b === el); }); }
  function ligaTiles(campo, autoAvanca) {
    Array.prototype.forEach.call(document.querySelectorAll("#car .tile"), function (b) {
      b.onclick = function () {
        if (campo === "marca" && E.marca !== b.dataset.v) E.modelo = null;
        E[campo] = b.dataset.v; marcar("#car .tile", b);
        if (autoAvanca || (campo === "ano" && E.mes)) setTimeout(avancar, 220); else desenhar(true);
      };
    });
  }
  function ligaGrandes(campo) {
    Array.prototype.forEach.call(document.querySelectorAll("[data-g]"), function (b) { b.onclick = function () { E[campo] = b.dataset.g; marcar("[data-g]", b); setTimeout(avancar, 260); }; });
  }
  function ligaPesquisa() {
    $("q").oninput = function () {
      var q = CC.normal(this.value);
      Array.prototype.forEach.call(document.querySelectorAll("#car .tile"), function (b) { b.style.display = CC.normal(b.dataset.v).indexOf(q) > -1 ? "" : "none"; });
    };
  }
  function botoes() {
    var p = PASSOS[i];
    $("voltar").style.visibility = i ? "visible" : "hidden";
    $("seguinte").disabled = !p.ok();
    $("seguinte").textContent = p.final ? "Pedir avaliação grátis" : (p.opcional && !E.fotos.length ? "Saltar →" : "Seguinte →");
  }
  function desenhar(manter) {
    var p = PASSOS[i];
    $("passo-n").textContent = "Passo " + (i + 1) + " de " + PASSOS.length;
    $("barra").innerHTML = PASSOS.map(function (_, k) { return '<i class="' + (k < i ? "feito" : k === i ? "atual" : "") + '"></i>'; }).join("");
    $("fichas").innerHTML = CC.resumo().map(function (t) { return "<span>" + t + "</span>"; }).join("");
    if (!manter) {
      var aj = typeof p.ajuda === "function" ? p.ajuda() : p.ajuda;
      $("conteudo").innerHTML = '<div class="passo"><h2>' + p.titulo + '</h2>' + (aj ? '<p class="ajuda">' + aj + '</p>' : "") + p.html() + '</div>';
      p.liga();
      var car = $("car"); $("setas").style.display = car ? "" : "none";
    }
    botoes();
  }
  function avancar() {
    if (!PASSOS[i].ok()) return;
    if (PASSOS[i].final) return terminar();
    i++; desenhar();
  }
  function terminar() {
    $("barra").innerHTML = PASSOS.map(function () { return '<i class="feito"></i>'; }).join("");
    $("passo-n").textContent = "Concluído";
    $("rodape").style.display = "none"; $("setas").style.display = "none";
    $("conteudo").innerHTML = '<div class="fim"><div class="visto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg></div><h2>Obrigado, ' + E.nome.split(" ")[0] + '!</h2><p>Recebemos o pedido de avaliação do seu <b>' + E.marca + " " + E.modelo + '</b>' + (E.fotos.length ? " com " + E.fotos.length + " foto(s)" : "") + '.<br>Em 24 horas irá receber uma proposta (por email ou contacto telefónico).</p></div>';
  }
  $("seguinte").onclick = avancar;
  $("voltar").onclick = function () { if (i) { i--; desenhar(); } };
  $("setas").onclick = function (ev) { var d = ev.target.dataset.dir; if (d && $("car")) $("car").scrollBy({ left: d * 470, behavior: "smooth" }); };
  desenhar();
})();
</script>
</body>
</html>
