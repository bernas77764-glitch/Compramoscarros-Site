<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Formulário B · Rodas — Compramos Carros</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comum.css">
<style>
body { background: var(--azul); color: #fff; }
.palco { position: relative; min-height: calc(100vh - 76px); padding: 44px 16px 90px; overflow: hidden; }
.palco::before { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, var(--verde) 0 34%, transparent 34%); }
.palco::after { content: "COMPRAMOS"; position: absolute; left: -10px; bottom: 30px; font: 900 180px/1 "Barlow", sans-serif; color: rgba(255, 255, 255, .05); white-space: nowrap; pointer-events: none; }
.grelha { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; display: grid; grid-template-columns: 330px 1fr; gap: 50px; align-items: start; }

/* Ficha da viatura */
.ficha { background: #fff; color: var(--azul); border-radius: var(--raio); box-shadow: 14px 14px 0 var(--lima); padding: 24px; position: sticky; top: 20px; }
.ficha h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--verde); margin-bottom: 4px; }
.ficha .nome { font: 900 26px/1.05 "Barlow", sans-serif; text-transform: uppercase; min-height: 56px; }
.ficha .nome span { color: var(--suave); font-weight: 600; font-size: 18px; text-transform: none; }
.silhueta { height: 74px; color: var(--verde); margin: 10px 0 12px; display: flex; align-items: center; justify-content: center; background: #f4fbfa; border-radius: 12px; }
.silhueta svg { width: 150px; height: 64px; }
.ficha dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; margin: 0; font-size: 15px; }
.ficha dt { color: var(--suave); }
.ficha dd { margin: 0; font-weight: 800; text-align: right; }
.ficha dd.vazio { color: #cfd2da; font-weight: 600; }
.ficha dd.novo { animation: brilho .8s; }
@keyframes brilho { 0% { background: var(--lima); } 100% { background: transparent; } }
.progresso { margin-top: 16px; height: 8px; background: var(--linha); border-radius: 6px; overflow: hidden; }
.progresso i { display: block; height: 100%; background: linear-gradient(90deg, var(--verde), var(--lima)); transition: width .4s; }

/* Passo */
.passo { animation: entrar .35s; }
.passo-n { font-weight: 800; color: var(--lima); text-transform: uppercase; letter-spacing: .1em; font-size: 13px; }
h2 { color: #fff; font-size: clamp(34px, 5vw, 58px); font-weight: 900; text-transform: uppercase; line-height: 1; margin: 8px 0 10px; }
h2 em { font-style: normal; color: var(--lima); }
.ajuda { color: #c9c7d6; margin: 0 0 22px; }

.rodas { display: flex; gap: 16px; }
.roda-wrap { position: relative; flex: 1; max-width: 460px; }
.roda-wrap .legenda { font-weight: 800; text-transform: uppercase; font-size: 12px; letter-spacing: .1em; color: var(--lima); margin-bottom: 6px; }
.roda { height: 280px; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; background: rgba(255, 255, 255, .06); border-radius: 18px; position: relative; -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
.roda::-webkit-scrollbar { display: none; }
.roda ul { list-style: none; margin: 0; padding: 112px 0; }
.roda li { height: 56px; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; font: 700 22px "Barlow", sans-serif; color: rgba(255, 255, 255, .45); cursor: pointer; transition: color .15s, transform .15s; user-select: none; }
.roda li.perto { color: rgba(255, 255, 255, .75); }
.roda li.ativo { color: var(--azul); font-weight: 900; font-size: 26px; transform: scale(1.04); }
.roda-wrap .faixa { position: absolute; left: 10px; right: 10px; bottom: 112px; height: 56px; border-radius: 12px; background: var(--lima); pointer-events: none; box-shadow: 0 8px 24px rgba(186, 229, 19, .35); }
.roda-wrap .faixa ~ .roda { z-index: 1; background: transparent; }
.roda-wrap .fundo { position: absolute; left: 0; right: 0; bottom: 0; height: 280px; background: rgba(255, 255, 255, .06); border-radius: 18px; }
.salto { margin-bottom: 12px; position: relative; max-width: 460px; }
.salto input { width: 100%; font: 600 17px "Barlow", sans-serif; color: #fff; background: rgba(255, 255, 255, .1); border: 2px solid transparent; border-radius: 12px; padding: 13px 16px 13px 44px; outline: none; }
.salto input::placeholder { color: rgba(255, 255, 255, .55); }
.salto input:focus { border-color: var(--lima); }
.salto svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; color: var(--lima); }

.opcoes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; max-width: 640px; }
.opcoes.quatro { grid-template-columns: repeat(4, 1fr); max-width: none; }
.opcao { background: rgba(255, 255, 255, .07); border: 2px solid rgba(255, 255, 255, .12); border-radius: 6px 24px 6px 24px; color: #fff; padding: 20px 12px 16px; cursor: pointer; text-align: center; font: 800 16px "Barlow", sans-serif; transition: transform .15s, border-color .15s, background .15s; }
.opcao svg { width: 80px; height: 52px; display: block; margin: 0 auto 10px; color: var(--lima); }
.opcao small { display: block; font-weight: 500; color: #c9c7d6; font-size: 13px; }
.opcao:hover { transform: translateY(-3px); border-color: var(--lima); }
.opcao.sel { background: var(--lima); color: var(--azul); border-color: var(--lima); }
.opcao.sel svg { color: var(--azul); }
.opcao.sel small { color: var(--azul); }

.claro-box { background: #fff; color: var(--texto); border-radius: 18px; padding: 22px; max-width: 640px; }
.campos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.campos .largo { grid-column: 1 / -1; }
.consent { display: flex; gap: 10px; font-size: 13px; color: var(--suave); margin-top: 14px; }
.consent input { accent-color: var(--verde); width: 18px; height: 18px; flex: 0 0 18px; }

.acoes { display: flex; align-items: center; gap: 14px; margin-top: 26px; }
.acoes .claro { color: #c9c7d6; }
.acoes .claro:hover { color: #fff; }
.fim { text-align: left; }
.fim .visto { width: 90px; height: 90px; border-radius: 50%; background: var(--lima); color: var(--azul); display: grid; place-items: center; margin-bottom: 18px; }
.fim .visto svg { width: 46px; }
.fim p { color: #c9c7d6; font-size: 18px; max-width: 520px; }
@media (max-width: 900px) {
  .grelha { grid-template-columns: 1fr; gap: 26px; }
  .ficha { position: relative; top: 0; padding: 16px 18px; display: grid; grid-template-columns: 1fr 110px; gap: 4px 14px; box-shadow: 8px 8px 0 var(--lima); }
  .ficha .nome { font-size: 20px; min-height: 0; }
  .ficha .silhueta { grid-row: 1 / 3; grid-column: 2; height: 60px; margin: 0; }
  .ficha .silhueta svg { width: 100px; }
  .ficha dl, .ficha h3 { display: none; }
  .ficha .progresso { grid-column: 1 / -1; margin-top: 8px; }
  .opcoes.quatro { grid-template-columns: repeat(2, 1fr); }
  .campos { grid-template-columns: 1fr; }
  .palco::after { font-size: 80px; }
}
</style>
</head>
<body>
<header class="topo-demo"><div class="c"><img src="../assets/img/logo.svg" alt="Compramos Carros"><a class="voltar" href="index.html">← Ver os 3 modelos</a></div></header>
<div class="palco">
  <div class="grelha">
    <aside class="ficha" aria-live="polite">
      <h3>A sua viatura</h3>
      <div class="nome" id="f-nome"><span>Ainda por escolher…</span></div>
      <div class="silhueta" id="f-sil"></div>
      <dl id="f-dl"></dl>
      <div class="progresso"><i id="f-prog"></i></div>
    </aside>
    <section id="conteudo"></section>
  </div>
</div>
<p class="aviso-demo">Modelo B · Rodas — demonstração, nada é enviado · <a href="index.html">ver outros</a></p>

<script src="../assets/js/marcas.js"></script>
<script src="comum.js"></script>
<script>
(function () {
  var E = CC.estado, i = 0, ultimo = "", $ = function (id) { return document.getElementById(id); };
  var LUPA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>';
  var CAMERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>';
  var ALTURA = 56;

  // Roda giratória: devolve o elemento e chama aoEscolher(valor) quando pára num item
  function roda(lista, valor, aoEscolher) {
    var wrap = document.createElement("div");
    wrap.className = "roda-wrap";
    wrap.innerHTML = '<div class="fundo"></div><div class="faixa"></div><div class="roda" tabindex="0"><ul>' + lista.map(function (v) { return "<li>" + v + "</li>"; }).join("") + "</ul></div>";
    var r = wrap.querySelector(".roda"), itens = r.querySelectorAll("li"), t;
    function atual() { return Math.max(0, Math.min(itens.length - 1, Math.round(r.scrollTop / ALTURA))); }
    function pintar() {
      var k = atual();
      Array.prototype.forEach.call(itens, function (li, n) { li.className = n === k ? "ativo" : Math.abs(n - k) === 1 ? "perto" : ""; });
      return k;
    }
    r.addEventListener("scroll", function () { pintar(); clearTimeout(t); t = setTimeout(function () { aoEscolher(lista[pintar()]); botoes(); }, 120); });
    Array.prototype.forEach.call(itens, function (li, n) { li.onclick = function () { r.scrollTo({ top: n * ALTURA, behavior: "smooth" }); }; });
    r.addEventListener("keydown", function (ev) {
      if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); r.scrollTo({ top: (atual() + (ev.key === "ArrowDown" ? 1 : -1)) * ALTURA, behavior: "smooth" }); }
    });
    wrap.irPara = function (n, suave) { r.scrollTo({ top: n * ALTURA, behavior: suave ? "smooth" : "auto" }); };
    setTimeout(function () { var n = Math.max(0, lista.indexOf(valor)); wrap.irPara(n); pintar(); aoEscolher(lista[n]); botoes(); }, 0);
    return wrap;
  }

  var PASSOS = [
    { titulo: 'Qual é a <em>marca</em>?', ajuda: "Gire a roda ou escreva para saltar.", ok: function () { return E.marca; },
      monta: function (c) {
        var lista = CC.marcas();
        c.insertAdjacentHTML("beforeend", '<div class="salto">' + LUPA + '<input id="q" placeholder="Escreva a marca…" autocomplete="off"></div>');
        var w = roda(lista, E.marca || "Peugeot", function (v) { if (E.marca !== v) E.modelo = null; E.marca = v; ficha(); });
        c.appendChild(w);
        $("q").oninput = function () { var q = CC.normal(this.value); var n = lista.findIndex(function (m) { return CC.normal(m).indexOf(q) === 0; }); if (n > -1) w.irPara(n, true); };
      } },
    { titulo: 'E o <em>modelo</em>?', ajuda: function () { return "Modelos " + E.marca + "."; }, ok: function () { return E.modelo; },
      monta: function (c) { c.appendChild(roda(CC.modelos(E.marca), E.modelo, function (v) { E.modelo = v; ficha(); })); } },
    { titulo: 'Ano e <em>mês</em>', ajuda: "Da primeira matrícula.", ok: function () { return E.ano && E.mes; },
      monta: function (c) {
        var d = document.createElement("div"); d.className = "rodas";
        var a = roda(CC.anos, E.ano || "2018", function (v) { E.ano = v; ficha(); });
        var m = roda(CC.meses, E.mes || "Janeiro", function (v) { E.mes = v; ficha(); });
        a.insertAdjacentHTML("afterbegin", '<div class="legenda">Ano</div>'); m.insertAdjacentHTML("afterbegin", '<div class="legenda">Mês</div>');
        d.appendChild(a); d.appendChild(m); c.appendChild(d);
      } },
    { titulo: 'Tipo de <em>caixa</em>', ajuda: "", ok: function () { return E.caixa; }, auto: true,
      monta: function (c) { opcoes(c, CC.caixas.map(function (x) { return { id: x.id, svg: x.svg, nota: x.nota }; }), "caixa", ""); } },
    { titulo: 'O <em>segmento</em>', ajuda: "Qual destes se parece mais com o seu?", ok: function () { return E.segmento; }, auto: true,
      monta: function (c) { opcoes(c, CC.segmentos, "segmento", "quatro"); } },
    { titulo: 'Os <em>detalhes</em>', ajuda: "", ok: function () { return E.matricula && E.km; },
      monta: function (c) {
        c.insertAdjacentHTML("beforeend", '<div class="claro-box"><div class="campos"><div><label class="rotulo-campo" for="mat">Matrícula</label><input class="entrada" id="mat" placeholder="AA-00-AA" maxlength="8"></div><div><label class="rotulo-campo" for="km">Quilómetros</label><input class="entrada" id="km" type="number" inputmode="numeric" placeholder="Ex.: 85000"></div><div class="largo"><label class="rotulo-campo" for="obs">Observações (opcional)</label><textarea class="entrada" id="obs" placeholder="Extras, estado geral, revisões, eventuais danos…"></textarea></div></div></div>');
        $("mat").value = E.matricula || ""; $("km").value = E.km || ""; $("obs").value = E.obs || "";
        $("mat").oninput = function () { this.value = this.value.toUpperCase(); E.matricula = this.value; ficha(); botoes(); };
        $("km").oninput = function () { E.km = this.value; ficha(); botoes(); };
        $("obs").oninput = function () { E.obs = this.value; };
      } },
    { titulo: 'As <em>fotos</em>', ajuda: "Opcional, até 10 fotos. Ajudam-nos a fazer uma proposta mais certa.", ok: function () { return true; }, opcional: true,
      monta: function (c) {
        c.insertAdjacentHTML("beforeend", '<div class="claro-box"><label class="zona-fotos">' + CAMERA + '<div><b>Carregar fotos</b><span>Exterior, interior, conta-quilómetros e eventuais danos.</span></div><input type="file" accept="image/*" multiple id="fotos"></label><div class="lista-fotos" id="lista"></div></div>');
        CC.fotos($("fotos"), $("lista"), function () { ficha(); botoes(); });
      } },
    { titulo: 'Para onde enviamos a <em>proposta</em>?', ajuda: "Em 24 horas irá receber uma proposta (por email ou contacto telefónico).", ok: function () { return E.nome && E.telefone && E.email && E.distrito && E.consent; }, final: true,
      monta: function (c) {
        c.insertAdjacentHTML("beforeend", '<div class="claro-box"><div class="campos"><div><label class="rotulo-campo" for="nome">Nome</label><input class="entrada" id="nome" autocomplete="name"></div><div><label class="rotulo-campo" for="tel">Telefone</label><input class="entrada" id="tel" type="tel" autocomplete="tel"></div><div><label class="rotulo-campo" for="email">E-mail</label><input class="entrada" id="email" type="email" autocomplete="email"></div><div><label class="rotulo-campo" for="dist">Distrito</label><select class="entrada" id="dist"><option value="">Escolha…</option>' + CC.DISTRITOS.map(function (d) { return "<option>" + d + "</option>"; }).join("") + '</select></div></div><label class="consent"><input type="checkbox" id="consent"><span>Os dados recolhidos serão incluídos na nossa agenda de contactos, de acordo com a legislação de proteção de dados em vigor. <a href="../politica-de-privacidade.html">Política de Privacidade</a></span></label></div>');
        [["nome", "nome"], ["tel", "telefone"], ["email", "email"], ["dist", "distrito"]].forEach(function (p) { var el = $(p[0]); el.value = E[p[1]] || ""; el.oninput = el.onchange = function () { E[p[1]] = el.value; botoes(); }; });
        $("consent").checked = !!E.consent; $("consent").onchange = function () { E.consent = this.checked; botoes(); };
      } }
  ];

  function opcoes(c, lista, campo, classe) {
    var d = document.createElement("div"); d.className = "opcoes " + classe;
    d.innerHTML = lista.map(function (o) { return '<button type="button" class="opcao' + (E[campo] === o.id ? " sel" : "") + '" data-o="' + o.id + '">' + o.svg + o.id + (o.nota ? "<small>" + o.nota + "</small>" : "") + "</button>"; }).join("");
    d.onclick = function (ev) {
      var b = ev.target.closest(".opcao"); if (!b) return;
      E[campo] = b.dataset.o;
      Array.prototype.forEach.call(d.children, function (x) { x.classList.toggle("sel", x === b); });
      ficha(); botoes(); setTimeout(avancar, 300);
    };
    c.appendChild(d);
  }

  function ficha() {
    $("f-nome").innerHTML = E.marca ? E.marca + (E.modelo ? "<br>" + E.modelo : "") : "<span>Ainda por escolher…</span>";
    var seg = CC.segmentos.filter(function (s) { return s.id === E.segmento; })[0];
    $("f-sil").innerHTML = seg ? seg.svg : CC.segmentos[1].svg.replace("<svg", '<svg style="opacity:.25"');
    var linhas = [["Data", E.ano ? (E.mes || "") + " " + E.ano : ""], ["Caixa", E.caixa], ["Segmento", E.segmento], ["Matrícula", E.matricula], ["Km", E.km ? Number(E.km).toLocaleString("pt-PT") : ""], ["Fotos", E.fotos.length ? E.fotos.length + "" : ""]];
    var assinatura = linhas.map(function (l) { return l[1]; }).join("|");
    $("f-dl").innerHTML = linhas.map(function (l) { return "<dt>" + l[0] + '</dt><dd class="' + (l[1] ? "" : "vazio") + '">' + (l[1] || "—") + "</dd>"; }).join("");
    ultimo = assinatura;
    $("f-prog").style.width = Math.round(i / PASSOS.length * 100) + "%";
  }
  function botoes() {
    var p = PASSOS[i], s = $("seguinte"); if (!s) return;
    s.disabled = !p.ok();
    s.textContent = p.final ? "Pedir avaliação grátis" : (p.opcional && !E.fotos.length ? "Saltar →" : "Confirmar →");
  }
  function desenhar() {
    var p = PASSOS[i], aj = typeof p.ajuda === "function" ? p.ajuda() : p.ajuda;
    var c = $("conteudo");
    c.innerHTML = '<div class="passo"><span class="passo-n">Passo ' + (i + 1) + " de " + PASSOS.length + "</span><h2>" + p.titulo + "</h2>" + (aj ? '<p class="ajuda">' + aj + "</p>" : "") + '<div id="corpo"></div><div class="acoes">' + (i ? '<button class="botao claro" id="voltar" type="button">← Voltar</button>' : "") + (p.auto ? "" : '<button class="botao" id="seguinte" type="button">Confirmar →</button>') + "</div></div>";
    p.monta($("corpo"));
    if ($("voltar")) $("voltar").onclick = function () { i--; desenhar(); };
    if ($("seguinte")) $("seguinte").onclick = avancar;
    ficha(); botoes();
  }
  function avancar() {
    if (!PASSOS[i].ok()) return;
    if (PASSOS[i].final) {
      i = PASSOS.length; ficha();
      $("conteudo").innerHTML = '<div class="passo fim"><div class="visto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg></div><h2>Obrigado, <em>' + E.nome.split(" ")[0] + "</em>!</h2><p>Recebemos o pedido de avaliação do seu " + E.marca + " " + E.modelo + ". Em 24 horas irá receber uma proposta (por email ou contacto telefónico).</p></div>";
      return;
    }
    i++; desenhar();
  }
  desenhar();
})();
</script>
</body>
</html>
